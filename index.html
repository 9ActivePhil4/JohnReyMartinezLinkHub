<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Rey Martinez | LinkHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-content">
            <span class="brand">LinkHub</span>
            <span class="credits">Created By John Rey</span>
        </div>
    </div>

<div class="main-box">
    <img src="images/WPP.jpg" alt="John Rey Martinez" class="profile-pic">
    <h2>John Rey Martinez</h2>
    
    <div class="status-container">
        <span id="status-indicator">Loading...</span>
    </div>
    
    <a href="https://9activephil4.github.io/JohnReyMartinezPorfolioWebsite/" class="portfolio-btn">Check My Portfolio</a>
    
    <div class="social-buttons">
        <a href="https://www.facebook.com/johnrey32016" target="_blank">Facebook</a>
        <a href="https://www.instagram.com/martinez_johnrey" target="_blank">Instagram</a>
        <a href="https://youtube.com/@johnreymartinez6307" target="_blank">YouTube</a>
    </div>

    <div class="contact-box">
        <fieldset class="contact-fieldset">
            <legend>Message me here</legend>
            <form action="https://formspree.io/f/xpwledgr" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="_replyto" placeholder="Your Email Address" required>
                <textarea name="message" placeholder="Your Message" rows="3" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </fieldset>
    </div>
    
    <div class="badge-container">
        <div class="badge" id="clock">Loading...</div>
        <a href="https://github.com" target="_blank" class="badge link-badge">Powered by GitHub</a>
    </div>

    <div class="footer-text">
        Created by John Rey Martinez © 2025
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
